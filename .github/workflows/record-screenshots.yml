name: Record screenshots

on:
    pull_request:
        types: [labeled]

permissions:
    contents: read
    issues: write

jobs:
    record:
        if: github.event.label.name == 'record-screenshots'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  ssh-key: ${{ secrets.RECORD_SSH_KEY }}

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            -   name: Record golden images
                run: ./gradlew recordPaparazziDebug

            -   name: Commit and push goldens
                run: |
                    git config user.name  "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add '**/src/test/snapshots/**/*.png'
                    if git diff --staged --quiet; then
                      echo "No screenshot changes to record."
                    else
                      git commit -m "chore: record Paparazzi golden images"
                      git push
                    fi

            - name: Remove the label so it can be re-applied later
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.removeLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        name: 'record-screenshots'
                      }).catch(() => {})
