name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4

            - name: Format check, tests, lint, assemble
              run: ./gradlew spotlessCheck test lint assembleDebug

            - name: Format check build-logic
              run: ./gradlew -p build-logic spotlessCheck


            - name: Screenshot verification
              run: ./gradlew verifyPaparazziDebug

            - name: Upload reports on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-reports
                  path: '**/build/reports/**'
                  retention-days: 7
